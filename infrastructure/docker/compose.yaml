name: livingdocs

services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: livingdocs
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # S01 — Identity & Organization
  identity-organization-service:
    profiles: ["services"]
    build:
      context: ../../backend/identity-organization-service
    environment:
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: db
      DB_URL: jdbc:postgresql://postgres:5432/livingdocs
      DB_SCHEMA: identity
      DB_USERNAME: ld_s01_app
      DB_PASSWORD: ${S01_DB_PASSWORD:-}
      FLYWAY_USERNAME: ld_s01_migrator
      FLYWAY_PASSWORD: ${S01_FLYWAY_PASSWORD:-}
      REDIS_HOST: redis
      JWT_ISSUER: urn:livingdocs:s01
      JWT_AUDIENCE: livingdocs-api
      JWT_PRIVATE_KEY_PATH: /run/secrets/s01_jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/s01_jwt_public.pem
      JWT_PREVIOUS_PUBLIC_KEY_PATH: ${S01_PREVIOUS_PUBLIC_KEY_PATH:-}
      LOGIN_RATE_LIMIT_PEPPER_PATH: /run/secrets/s01_login_rate_pepper
      S01_WORKLOAD_REGISTRY_PATH: /run/secrets/s01_workloads.json
      S01_INTERNAL_ALLOW_INSECURE_TRANSPORT: "true"
    volumes:
      - ${S01_JWT_SECRETS_DIR:-../../../livingdocs-secrets}:/run/secrets:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot operator CLI. No HTTP port and no grant endpoint.
  s01-provisioner:
    profiles: ["operator"]
    build:
      context: ../../backend/identity-organization-service
    environment:
      SPRING_PROFILES_ACTIVE: db,provision
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_FLYWAY_ENABLED: "false"
      DB_URL: jdbc:postgresql://postgres:5432/livingdocs
      DB_SCHEMA: identity
      DB_USERNAME: ${S01_OPERATOR_DB_LOGIN:?S01_OPERATOR_DB_LOGIN is required}
      DB_PASSWORD: ${S01_OPERATOR_DB_PASSWORD:?S01_OPERATOR_DB_PASSWORD is required}
      LIVINGDOCS_PROVISIONING_MANIFEST: /run/provision/manifest.json
    volumes:
      - ${S01_PROVISION_MANIFEST_DIR:-./provisioning}:/run/provision:ro
    depends_on:
      postgres:
        condition: service_healthy

  # S02 — Repository Integration
  repository-integration-service:
    profiles: ["services"]
    build:
      context: ../../backend/repository-integration-service
    environment:
      SERVER_PORT: "8082"
      SPRING_PROFILES_ACTIVE: db
      DB_URL: jdbc:postgresql://postgres:5432/livingdocs
      DB_SCHEMA: repository
      DB_USERNAME: ld_s02_app
      DB_PASSWORD: ${S02_DB_PASSWORD:-}
      FLYWAY_USERNAME: ld_s02_migrator
      FLYWAY_PASSWORD: ${S02_FLYWAY_PASSWORD:-}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  # S03 — Source Intelligence
  source-intelligence-service:
    profiles: ["services"]
    build:
      context: ../../backend/source-intelligence-service
    environment:
      SERVER_PORT: "8083"
    ports:
      - "127.0.0.1:8083:8083"

  # S04 — Document Governance
  document-governance-service:
    profiles: ["services"]
    build:
      context: ../../backend/document-governance-service
    environment:
      SERVER_PORT: "8084"
      SPRING_PROFILES_ACTIVE: db
      DB_URL: jdbc:postgresql://postgres:5432/livingdocs
      DB_SCHEMA: document
      DB_USERNAME: ld_s04_app
      DB_PASSWORD: ${S04_DB_PASSWORD:-}
      FLYWAY_USERNAME: ld_s04_migrator
      FLYWAY_PASSWORD: ${S04_FLYWAY_PASSWORD:-}
      S01_ISSUER_URI: ${JWT_ISSUER_URI:-urn:livingdocs:s01}
      S01_JWK_SET_URI: http://identity-organization-service:8081/.well-known/jwks.json
      S04_TOKEN_AUDIENCE: ${JWT_AUDIENCE:-livingdocs-api}
      S01_REVIEW_ACCESS_CONTEXT_URI: http://identity-organization-service:8081/api/v1/users/me/access-context
      S01_REVIEW_SERVICE_TOKEN_URI: http://identity-organization-service:8081/internal/v1/auth/service-tokens
      S01_REVIEW_AUTHORIZATION_URI: http://identity-organization-service:8081/internal/v1/authorization/evaluate
      S04_REVIEW_WORKLOAD_SECRET_PATH: /run/secrets/s04/s04.secret
      # Local Compose network only; deployed environments must use HTTPS.
      S04_REVIEW_ALLOW_INSECURE_HTTP: "true"
      S01_SUBMIT_ACCESS_CONTEXT_URI: http://identity-organization-service:8081/api/v1/users/me/access-context
      S04_SUBMIT_ALLOW_INSECURE_HTTP: "true" # Local Compose transport exception.
    volumes:
      # Dedicated caller secret only, outside the repository; never S01's signing-key directory.
      - ${S04_WORKLOAD_SECRETS_DIR:-../../../livingdocs-s04-secrets}:/run/secrets/s04:ro
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway — chỉ bật khi S01 JWT issuer thực tế sẵn sàng
  api-gateway:
    profiles: ["gateway"]
    build:
      context: ../api-gateway
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_BIND_ADDRESS: 0.0.0.0
      GATEWAY_MANAGEMENT_PORT: "9091" # cong danh cho actuator/health
      GATEWAY_MANAGEMENT_ADDRESS: 0.0.0.0

      #giao tiep noi bo (docker, gateway,..)
      S01_SERVICE_URI: http://identity-organization-service:8081
      S02_SERVICE_URI: http://repository-integration-service:8082
      S03_SERVICE_URI: http://source-intelligence-service:8083
      S04_SERVICE_URI: http://document-governance-service:8084

      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-urn:livingdocs:s01}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-livingdocs-api}
      JWT_JWK_SET_URI: http://identity-organization-service:8081/.well-known/jwks.json
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:9091"

  kafka:
    image: apache/kafka:4.1.2
    profiles: ["platform"]
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  redis:
    image: redis:8.2-alpine
    profiles: ["services", "platform"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ../../ai-service
      dockerfile: Dockerfile
    profiles: ["platform"]
    ports:
      - "127.0.0.1:${AI_SERVICE_HOST_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
  kafka_data:
