components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal service identity; không public qua Gateway.
  responses:
    Problem:
      description: RFC 9457 + LivingDocs code/correlationId
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details + extension code/correlationId.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        correlationId:
          type: string
    CandidateObject:
      type: object
      additionalProperties: true
      description: 'CHƯA CHỐT: shape DTO dự kiến theo LD-API-001; service owner phải thay bằng properties/required
        cụ thể trước khi tuyên bố contract stable. Không dùng làm client codegen chính thức.'
    AccessTokenView:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: CANDIDATE — đăng ký local; các field khác do S01 xác nhận.
    UserProfileView:
      type: object
      description: 'CANDIDATE S01: owner xác nhận field privacy, required và profile update.'
      properties:
        identityId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        activeTenantId:
          type: string
          format: uuid
          nullable: true
    UserProfilePatch:
      type: object
      description: 'CANDIDATE: cập nhật thông tin cá nhân, không nhận tenant roles.'
      additionalProperties: false
      properties:
        displayName:
          type: string
    TenantView:
      type: object
      description: 'CANDIDATE S01: tenant membership hiện hành phải được server kiểm.'
      properties:
        tenantId:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
    WorkspaceCreateRequest:
      type: object
      description: 'CANDIDATE: S01 quyết định naming/validation, tenant lấy từ URI và principal, không đọc từ body.'
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
    WorkspaceView:
      type: object
      description: 'CANDIDATE S01: response dùng cho workspace list/detail.'
      properties:
        workspaceId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
    WorkspaceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    WorkspaceMembershipView:
      type: object
      description: CANDIDATE; roles lấy theo membership authoritative.
      properties:
        membershipId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        identityId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
    WorkspaceMembershipRequest:
      type: object
      description: CANDIDATE. Membership phải thuộc tenant đang hoạt động.
      properties:
        identityId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
    AccessContextView:
      type: object
      description: 'CANDIDATE S01: chỉ xem scopes của current principal, không thay thế fresh authorization cho approve/publish.'
      properties:
        tenantId:
          type: string
          format: uuid
        workspaceGrants:
          type: array
          items:
            type: object
            properties:
              workspaceId:
                type: string
                format: uuid
              roles:
                type: array
                items:
                  type: string
              repositoryIds:
                type: array
                items:
                  type: string
                  format: uuid
