openapi: 3.0.3
info:
  title: LivingDocs S01 — Implemented APIs and Contract Candidates
  version: 0.2.0
  description: >-
    LD-API-001 v0.4 + LIV-133. S01 :8081/v3/api-docs chỉ liệt kê controller đang chạy:
    Register, Login, API-038, API-039, Service Token và JWKS. YAML này còn có
    CANDIDATE/BLOCKED từ API inventory để thiết kế; những path đó chưa có controller.
    x-contract-state thể hiện trạng thái contract; các UUID/JWT trong example chỉ
    minh họa wire shape, không phải fixture hoặc bằng chứng API đã chạy.
x-livingdocs-source: LD-API-001 v0.4 / LIV-133
x-livingdocs-jwks-path: /.well-known/jwks.json
paths:
  /api/v1/auth/register:
    post:
      tags:
        - S01 Public
      operationId: api001_post
      summary: Đăng ký người dùng
      description: 'LD-API-001 API-001. Đăng ký local credential; không cấp JWT, tenant hoặc role.'
      x-api-id: API-001
      x-contract-state: IN_PROGRESS
      x-gateway-exposure: public
      x-yaml-problem-alias: &id001
        $ref: '#/components/responses/Problem'
      responses:
        '201':
          description: Identity đã được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterApiResponse'
              examples:
                standardRegistration:
                  summary: Successful registration
                  value: &registerSuccessExample
                    code: IDENTITY_REGISTERED
                    message: Registration completed
                    data:
                      identityId: 5c94a297-169d-4fea-8582-a22f82dd799e
                password12Characters:
                  summary: Password meets the minimum length
                  value: *registerSuccessExample
                password64AsciiCharacters:
                  summary: Password meets the maximum ASCII length
                  value: *registerSuccessExample
        '400':
          description: Invalid registration request, including validation errors or malformed JSON.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidEmail:
                  summary: Invalid email format
                  value: &invalidRegistrationProblem
                    type: about:blank
                    title: Invalid request
                    status: 400
                    detail: Registration request is invalid
                    instance: urn:uuid:10000000-0000-4000-8000-000000000001
                    code: INVALID_REQUEST
                    correlationId: example-correlation-400
                emptyEmail:
                  summary: Empty email
                  value: *invalidRegistrationProblem
                missingEmail:
                  summary: Missing email
                  value: *invalidRegistrationProblem
                missingPassword:
                  summary: Missing password
                  value: *invalidRegistrationProblem
                emptyPassword:
                  summary: Empty password
                  value: *invalidRegistrationProblem
                password11Characters:
                  summary: Password below minimum length
                  value: *invalidRegistrationProblem
                password65AsciiCharacters:
                  summary: Password above maximum length
                  value: *invalidRegistrationProblem
                passwordOver72Utf8Bytes:
                  summary: Password exceeds 72 UTF-8 bytes
                  value: *invalidRegistrationProblem
                malformedJson:
                  summary: Malformed JSON
                  value: *invalidRegistrationProblem
        '409':
          description: An identity already exists for this email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                duplicateEmail:
                  summary: Email already registered
                  value: &duplicateIdentityProblem
                    type: about:blank
                    title: Identity already exists
                    status: 409
                    detail: An identity already exists for this email
                    instance: urn:uuid:20000000-0000-4000-8000-000000000001
                    code: IDENTITY_ALREADY_EXISTS
                    correlationId: example-correlation-409
                duplicateEmailCaseInsensitive:
                  summary: Email differs only by letter case
                  value: *duplicateIdentityProblem
                duplicateEmailWithAsciiSpaces:
                  summary: Email has surrounding ASCII spaces
                  value: *duplicateIdentityProblem
        '415':
          description: Request Content-Type is not application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unsupportedContentType:
                  summary: Unsupported Content-Type
                  value:
                    type: about:blank
                    title: Unsupported media type
                    status: 415
                    detail: Content-Type must be application/json
                    instance: urn:uuid:30000000-0000-4000-8000-000000000001
                    code: UNSUPPORTED_MEDIA_TYPE
                    correlationId: example-correlation-415
        '500':
          description: Registration could not be completed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                safeInternalError:
                  summary: Internal error without exception details
                  value:
                    type: about:blank
                    title: Internal error
                    status: 500
                    detail: The request could not be completed
                    instance: urn:uuid:40000000-0000-4000-8000-000000000001
                    code: INTERNAL_ERROR
                    correlationId: example-correlation-500
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/login:
    post:
      tags:
        - S01 Public
      operationId: api002_post
      summary: Đăng nhập bằng local credential và phát access JWT
      description: >-
        LIV-137 API-002. Email/password thật; chỉ phát access token 15 phút.
        Identity không cần tenant membership. Không phát refresh token, cookie,
        role hoặc tenant claim. Email không tồn tại, sai password và identity
        inactive cùng trả INVALID_CREDENTIALS (401). Request sai định dạng trả
        INVALID_REQUEST (400); Content-Type khác application/json trả
        UNSUPPORTED_MEDIA_TYPE (415). Quá giới hạn đăng nhập trả 429 kèm
        Retry-After; Redis/pepper không khả dụng trả 503 và không cấp JWT.
      x-api-id: API-002
      x-contract-state: IN_PROGRESS
      x-gateway-exposure: public
      responses:
        '200':
          description: Access token đã phát. Cache-Control no-store.
          headers:
            Cache-Control: &loginNoStoreHeader
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApiResponse'
              example:
                code: LOGIN_SUCCEEDED
                message: Login completed
                data:
                  accessToken: eyJ...redacted
                  tokenType: Bearer
                  expiresIn: 900
        '400':
          description: Body thiếu/sai định dạng hoặc không qua Bean Validation.
          headers:
            Cache-Control: *loginNoStoreHeader
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Invalid request
                status: 400
                detail: Login request is invalid
                instance: urn:uuid:40000000-0000-4000-8000-000000000002
                code: INVALID_REQUEST
                correlationId: example-correlation-400
        '401':
          description: Unknown email, wrong password hoặc inactive identity; cùng một public error.
          headers:
            Cache-Control: *loginNoStoreHeader
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Invalid credentials
                status: 401
                detail: Invalid email or password
                instance: urn:uuid:40000000-0000-4000-8000-000000000003
                code: INVALID_CREDENTIALS
                correlationId: example-correlation-401
        '415':
          description: Content-Type phải là application/json.
          headers:
            Cache-Control: *loginNoStoreHeader
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unsupported media type
                status: 415
                detail: Content-Type must be application/json
                instance: urn:uuid:40000000-0000-4000-8000-000000000004
                code: UNSUPPORTED_MEDIA_TYPE
                correlationId: example-correlation-415
        '429':
          description: Giới hạn đăng nhập theo normalized identifier hoặc toàn hệ thống.
          headers:
            Cache-Control: *loginNoStoreHeader
            Retry-After:
              description: Số giây cần chờ trước khi thử lại.
              schema:
                type: string
                pattern: '^[0-9]+$'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Too many requests
                status: 429
                detail: Too many login attempts
                instance: urn:uuid:40000000-0000-4000-8000-000000000005
                code: LOGIN_RATE_LIMITED
                correlationId: example-correlation-429
        '503':
          description: Redis hoặc pepper không khả dụng; login fail closed.
          headers:
            Cache-Control: *loginNoStoreHeader
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Service unavailable
                status: 503
                detail: Login is temporarily unavailable
                instance: urn:uuid:40000000-0000-4000-8000-000000000006
                code: LOGIN_SECURITY_UNAVAILABLE
                correlationId: example-correlation-503
        '500':
          description: Lỗi xử lý nội bộ không chứa credential hoặc JWT.
          headers:
            Cache-Control: *loginNoStoreHeader
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Internal error
                status: 500
                detail: The request could not be completed
                instance: urn:uuid:40000000-0000-4000-8000-000000000007
                code: INTERNAL_ERROR
                correlationId: example-correlation-500
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: person@example.com
              password: A-secure-password-123
