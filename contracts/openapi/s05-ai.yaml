      x-gateway-exposure: not-enabled
      responses:
        '200':
          description: Kết quả dự kiến từ LD-API-001; DTO candidate phải được owner xác nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateObject'
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      security:
        - serviceAuth: []
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: 'CANDIDATE: xác nhận format với owner từng service.'
  /internal/v1/ai/executions/{executionId}/result:
