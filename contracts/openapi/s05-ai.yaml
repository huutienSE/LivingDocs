openapi: 3.0.3
info:
  title: LivingDocs S05 AI Service
  version: 0.1.0
  description: S05 /health đã được triển khai. AI internal APIs từ LD-API-001 vẫn là CANDIDATE; chưa chứng minh execution
    runtime, không công khai qua Gateway.
x-livingdocs-source: LD-API-001 v0.4 / LIV-133
paths:
  /internal/v1/ai/executions:
    post:
      tags:
        - S05 Internal
      operationId: api164_post
      summary: AI execution internal
      description: 'LD-API-001 API-164. Trạng thái: INTERNAL_CANDIDATE. Không coi đây là endpoint hoạt động khi chưa
        có controller/CI và xác nhận owner.'
      x-api-id: API-164
      x-contract-state: INTERNAL_CANDIDATE
      x-gateway-exposure: not-enabled
      responses:
        '202':
          description: Kết quả dự kiến từ LD-API-001; DTO candidate phải được owner xác nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateObject'
        '400': &id001
          $ref: '#/components/responses/Problem'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
      security:
        - serviceAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: Đổi payload với cùng key trả 409. Scope của key phải do owner xác nhận.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateObject'
  /internal/v1/ai/executions/{executionId}:
    get:
      tags:
        - S05 Internal
      operationId: api165_get
      summary: AI execution status internal
      description: 'LD-API-001 API-165. Trạng thái: INTERNAL_CANDIDATE. Không coi đây là endpoint hoạt động khi chưa
