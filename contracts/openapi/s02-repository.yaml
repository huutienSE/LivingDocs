                enum:
                - no-store
            X-Correlation-ID:
              required: true
              schema:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
            Retry-After:
              required: true
              schema:
                type: string
                pattern: ^[1-9][0-9]*$
          content:
            application/problem+json:
              schema:
                allOf:
