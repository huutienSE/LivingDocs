          - AUTHORIZATION_CONTEXT_CONSUMED
          - AUTHORIZATION_CONTEXT_NOT_READY
          - AUTHORIZATION_CONFIGURATION_CHANGED
          - GITHUB_REAUTHORIZATION_REQUIRED
          - INSTALLATION_SELECTION_CHANGED
        '429':
          description: Context creation capacity reached; retry after context expiry. Not a new product quota.
