      security:
      - bearerAuth: []
      operationId: api046_get
      summary: Required permissions and scoped installation verification
      parameters:
      - name: workspaceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: ''
      - name: authorizationContextId
        in: query
        required: false
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        description: Owned, unexpired S02 context; optional only to show requirements before authorization.
      - name: installationId
        in: query
        required: false
        schema:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        description: Requires authorizationContextId. Never an ownership assertion.
      - name: installationPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 2147483647
          default: 1
        description: Only with installationId. Re-read the selected user-scoped page; missing selected ID is
          409 SELECTION_CHANGED, not a negative installation lookup.
      responses:
        '200':
          description: Typed success; no credentials.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-ID:
              required: true
              schema:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          content:
            application/json:
