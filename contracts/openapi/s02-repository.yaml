          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/GitHubAuthorizationProblem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - USER_TOKEN_TRUST_UNAVAILABLE
                      - AUTHORIZATION_CONTEXT_UNAVAILABLE
                      - GITHUB_AUTHORIZATION_UNAVAILABLE
                      - GITHUB_AUTHORIZATION_CONFIG_UNAVAILABLE
                      - AUTHORIZATION_CAPACITY_EXCEEDED
                      - UPSTREAM_UNAVAILABLE
          x-error-codes:
          - USER_TOKEN_TRUST_UNAVAILABLE
          - AUTHORIZATION_CONTEXT_UNAVAILABLE
          - GITHUB_AUTHORIZATION_UNAVAILABLE
          - GITHUB_AUTHORIZATION_CONFIG_UNAVAILABLE
          - AUTHORIZATION_CAPACITY_EXCEEDED
          - UPSTREAM_UNAVAILABLE
        '504':
          description: Gateway downstream timeout. Does not imply a successful background operation.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-ID:
              required: true
              schema:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/GitHubAuthorizationProblem'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - UPSTREAM_TIMEOUT
          x-error-codes:
          - UPSTREAM_TIMEOUT
      description: Required App profile and owner-bound onboarding context. Selected installation verification/readiness
        is integrated in the following slices; this operation remains IN_PROGRESS until acceptance.
      x-invariants:
      - workspaceId is nonzero UUID; authorizationContextId is nonzero UUID when provided.
      - installationId requires authorizationContextId; installationPage requires installationId.
      - Context NONE iff verification USER_AUTHORIZATION_REQUIRED.
      - Context PENDING iff verification AUTHORIZATION_PENDING.
      - Context AUTHORIZED is required for INSTALLATION_SELECTION_REQUIRED and all verified branches.
      - Verified installationId equals requested installationId; metadata App identity equals pinned configured
        App.
      - repositoryAccessVerified is always false; this is not a repository connection capability.
      - No write, token mint/refresh, or hidden installation pagination scan in API-046 GET.
      x-design-state: APPROVED
      x-api-id: API-046
  /api/v1/integrations/github/authorization-contexts:
