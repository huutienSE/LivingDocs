                    code:
                      type: string
                      enum:
                      - AUTHORIZATION_CONTEXT_LIMIT_REACHED
          x-error-codes:
          - AUTHORIZATION_CONTEXT_LIMIT_REACHED
        '500':
          description: Unexpected internal failure; no raw dependency body.
          headers:
            Cache-Control:
              required: true
              schema:
