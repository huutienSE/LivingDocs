components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal service identity; không public qua Gateway.
  responses:
    Problem:
      description: RFC 9457 + LivingDocs code/correlationId
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GitHubAuthorizationProblem400:
      description: Invalid request input or OAuth callback state. Operation-specific query/body/state rules apply.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INVALID_REQUEST
                  - OAUTH_STATE_INVALID
      x-error-codes:
      - INVALID_REQUEST
      - OAUTH_STATE_INVALID
    GitHubAuthorizationProblem401:
      description: LivingDocs user JWT missing or invalid. Provider token rejection uses a separate 409/503 code.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        WWW-Authenticate:
          required: true
          schema:
            type: string
            enum:
            - Bearer
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - UNAUTHENTICATED
      x-error-codes:
      - UNAUTHENTICATED
    GitHubAuthorizationProblem403:
      description: Workspace role denied, or verified user lacks permitted GitHub access.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - FORBIDDEN_SCOPE
                  - GITHUB_ACCESS_DENIED
      x-error-codes:
      - FORBIDDEN_SCOPE
      - GITHUB_ACCESS_DENIED
    GitHubAuthorizationProblem404:
      description: Workspace/context not visible; does not prove an installation is uninstalled.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - WORKSPACE_NOT_FOUND
                  - AUTHORIZATION_CONTEXT_NOT_FOUND
      x-error-codes:
      - WORKSPACE_NOT_FOUND
      - AUTHORIZATION_CONTEXT_NOT_FOUND
    GitHubAuthorizationProblem406:
      description: Requested response media type unsupported.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - NOT_ACCEPTABLE
      x-error-codes:
      - NOT_ACCEPTABLE
    GitHubAuthorizationProblem409:
      description: Context expired, consumed, not ready, configuration changed, reauthorization required or selected
        installation moved. Restart/refresh according to stable code; never infer uninstallation.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - AUTHORIZATION_CONTEXT_EXPIRED
                  - AUTHORIZATION_CONTEXT_CONSUMED
                  - AUTHORIZATION_CONTEXT_NOT_READY
                  - AUTHORIZATION_CONFIGURATION_CHANGED
                  - GITHUB_REAUTHORIZATION_REQUIRED
                  - INSTALLATION_SELECTION_CHANGED
      x-error-codes:
      - AUTHORIZATION_CONTEXT_EXPIRED
      - AUTHORIZATION_CONTEXT_CONSUMED
      - AUTHORIZATION_CONTEXT_NOT_READY
      - AUTHORIZATION_CONFIGURATION_CHANGED
      - GITHUB_REAUTHORIZATION_REQUIRED
      - INSTALLATION_SELECTION_CHANGED
    GitHubAuthorizationProblem429:
      description: Context creation capacity reached; retry after context expiry. Not a new product quota.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - AUTHORIZATION_CONTEXT_LIMIT_REACHED
      x-error-codes:
      - AUTHORIZATION_CONTEXT_LIMIT_REACHED
    GitHubAuthorizationProblem500:
      description: Unexpected internal failure; no raw dependency body.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INTERNAL_ERROR
      x-error-codes:
      - INTERNAL_ERROR
    GitHubAuthorizationProblem503:
      description: Trust, S01, GitHub, configuration, secret store or bounded execution cannot be verified; fail
        closed with a stable dependency code.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - USER_TOKEN_TRUST_UNAVAILABLE
                  - AUTHORIZATION_CONTEXT_UNAVAILABLE
                  - GITHUB_AUTHORIZATION_UNAVAILABLE
                  - GITHUB_AUTHORIZATION_CONFIG_UNAVAILABLE
                  - AUTHORIZATION_CAPACITY_EXCEEDED
                  - UPSTREAM_UNAVAILABLE
      x-error-codes:
      - USER_TOKEN_TRUST_UNAVAILABLE
      - AUTHORIZATION_CONTEXT_UNAVAILABLE
      - GITHUB_AUTHORIZATION_UNAVAILABLE
      - GITHUB_AUTHORIZATION_CONFIG_UNAVAILABLE
      - AUTHORIZATION_CAPACITY_EXCEEDED
      - UPSTREAM_UNAVAILABLE
    GitHubAuthorizationProblem504:
      description: Gateway downstream timeout. Does not imply a successful background operation.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            enum:
            - no-store
        X-Correlation-ID:
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/GitHubAuthorizationProblem'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - UPSTREAM_TIMEOUT
      x-error-codes:
      - UPSTREAM_TIMEOUT
  schemas:
    RepositoryBindingRequest:
      type: object
      additionalProperties: false
      required: [tenantId, workspaceId, repositoryConnectionId]
      properties:
        tenantId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        repositoryConnectionId: {type: string, format: uuid}
    RepositoryBindingView:
      type: object
      additionalProperties: false
      required: [tenantId, workspaceId, repositoryConnectionId, status, bindingRevision, observedAt]
      properties:
        tenantId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        repositoryConnectionId: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE]}
        bindingRevision: {type: integer, format: int64, minimum: 1}
        observedAt: {type: string, format: date-time}
    RepositoryBindingResponse:
      type: object
      additionalProperties: false
      required: [code, message, data]
      properties:
        code: {type: string, enum: [REPOSITORY_BINDING_VERIFIED]}
        message: {type: string, enum: [Repository binding verified]}
        data: {$ref: '#/components/schemas/RepositoryBindingView'}
    Problem:
      type: object
      description: RFC 9457 Problem Details + extension code/correlationId.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        correlationId:
          type: string
    SourceResolveRequest:
      type: object
      additionalProperties: false
      required:
      - repositoryConnectionId
      - targetKind
      - targetRef
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        targetKind:
          type: string
          enum:
          - TRACKED_BRANCH
          - PR
        targetRef:
          type: string
          minLength: 1
          maxLength: 512
          description: 'TRACKED_BRANCH: full Git ref refs/heads/...; PR: positive decimal 1..2147483647, no leading
            zero.'
        explicitSha:
          type: string
          pattern: ^(?!0{40}$)[0-9a-fA-F]{40}$
    SourceSnapshotView:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - workspaceId
      - repositoryConnectionId
      - targetKind
      - targetRef
      - resolvedSha
      - configRevision
      properties:
        tenantId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        workspaceId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        repositoryConnectionId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        targetKind:
          type: string
          enum:
          - TRACKED_BRANCH
          - PR
        targetRef:
          type: string
          minLength: 1
          maxLength: 512
          description: 'TRACKED_BRANCH: full Git ref refs/heads/...; PR: positive decimal 1..2147483647, no leading
            zero.'
        resolvedSha:
          type: string
          pattern: ^(?!0{40}$)[0-9a-fA-F]{40}$
        configRevision:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
    SuccessResponseSourceSnapshotView:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          enum:
          - SOURCE_RESOLVED
        message:
          type: string
          enum:
          - Source resolved
        data:
          $ref: '#/components/schemas/SourceSnapshotView'
    SuccessResponseSourceValidationReceipt:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          enum:
          - SOURCE_VALIDATED
        message:
          type: string
          enum:
          - Source validated
        data:
          $ref: '#/components/schemas/SourceValidationReceipt'
    CandidateObject:
      type: object
      additionalProperties: true
      description: 'CHƯA CHỐT: shape DTO dự kiến theo LD-API-001; service owner phải thay bằng properties/required
        cụ thể trước khi tuyên bố contract stable. Không dùng làm client codegen chính thức.'
    JobAccepted:
      type: object
      description: CANDIDATE — operationId/jobId sẽ do owner S02/S03 chốt. 202 không có nghĩa job hoàn thành.
      properties:
        jobId:
          type: string
        operationId:
          type: string
    SourceValidationReceipt:
      type: object
      additionalProperties: false
      required:
      - validationStatus
      - reason
      - validationId
      - tenantId
      - workspaceId
      - repositoryConnectionId
      - targetKind
      - targetRef
      - validatedHeadSha
      - configRevision
      - sourceRevision
      - checkedAt
      - expiresAt
      properties:
        validationStatus:
          type: string
          enum:
          - PASS
        reason:
          type: string
          enum:
          - CURRENT
        validationId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        tenantId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        workspaceId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        repositoryConnectionId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        targetKind:
          type: string
          enum:
          - TRACKED_BRANCH
          - PR
        targetRef:
          type: string
          minLength: 1
          maxLength: 512
          description: 'TRACKED_BRANCH: full Git ref refs/heads/...; PR: positive decimal 1..2147483647, no leading
            zero.'
        validatedHeadSha:
          type: string
          pattern: ^(?!0{40}$)[0-9a-fA-F]{40}$
        configRevision:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
        sourceRevision:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive BIGINT as a decimal string; maximum 9223372036854775807.
        checkedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    RepositoryConnectRequest:
      type: object
      description: 'CANDIDATE S02: xác nhận IDs theo GitHub App installation thay vì tin client về permission.'
      properties:
        repositoryFullName:
          type: string
        installationId:
          type: string
        trackedBranch:
          type: string
    RepositoryConnectionView:
      type: object
      description: CANDIDATE S02; không trả GitHub credentials/token.
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        repositoryFullName:
          type: string
        status:
          type: string
        defaultBranch:
          type: string
        trackedBranch:
          type: string
          nullable: true
        lastSynchronizedAt:
          type: string
          format: date-time
          nullable: true
    RepositoryConnectionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryConnectionView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    TrackedBranchView:
      type: object
      description: CANDIDATE; active PR source target/tracked branch semantics phải theo REQ-04.
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
        branches:
          type: array
          items:
            type: string
        defaultBranch:
          type: string
    RepositoryRecheckRequest:
      type: object
      description: 'CANDIDATE: request SHA explicit, S02 phải kiểm GitHub head theo source authority.'
      properties:
        targetKind:
          type: string
          enum:
            - PR
            - TRACKED_BRANCH
        targetRef:
          type: string
        expectedHeadSha:
          type: string
        comparisonSha:
          type: string
          nullable: true
    SourceValidationRequest:
      type: object
      additionalProperties: false
      required:
      - repositoryConnectionId
      - targetKind
      - targetRef
      - boundHeadSha
      - configRevision
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        targetKind:
          type: string
          enum:
          - TRACKED_BRANCH
          - PR
        targetRef:
          type: string
          minLength: 1
          maxLength: 512
          description: 'TRACKED_BRANCH: full Git ref refs/heads/...; PR: positive decimal 1..2147483647, no leading
            zero.'
        boundHeadSha:
          type: string
          pattern: ^(?!0{40}$)[0-9a-fA-F]{40}$
        configRevision:
          type: string
          minLength: 1
          maxLength: 255
          pattern: \S
    GitHubAppView:
      type: object
      properties:
        appId:
          type: string
        slug:
          type: string
        name:
          type: string
        installationUrl:
          type: string
      required:
      - appId
      - installationUrl
      - name
      - slug
    GitHubAuthorizationContextView:
      type: object
      properties:
        status:
          type: string
          enum:
          - NONE
      required:
      - status
    GitHubAuthorizationVerificationView:
      type: object
      properties:
        status:
          type: string
          enum:
          - USER_AUTHORIZATION_REQUIRED
      required:
      - status
    GitHubRequiredPermission:
      type: object
      properties:
        category:
          type: string
        name:
          type: string
        level:
          type: string
        purpose:
          type: string
      required:
      - category
      - level
      - name
      - purpose
    SuccessResponseGitHubAuthorizationView:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/GitHubAuthorizationView'
      required:
      - code
      - data
      - message
    GitHubAuthorizationPermission:
      type: object
      additionalProperties: false
      required:
      - category
      - name
      - level
      properties:
        category:
          type: string
          enum:
          - REPOSITORY
          - ORGANIZATION
          - ACCOUNT
          - ENTERPRISE
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        level:
          type: string
          enum:
          - read
          - write
          - admin
    GitHubAuthorizationRequiredPermission:
      type: object
      additionalProperties: false
      required:
      - category
      - name
      - level
      - purpose
      properties:
        category:
          type: string
          enum:
          - REPOSITORY
          - ORGANIZATION
          - ACCOUNT
          - ENTERPRISE
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        level:
          type: string
          enum:
          - read
          - write
          - admin
        purpose:
          type: string
          minLength: 1
          maxLength: 300
    GitHubAuthorizationApp:
      type: object
      additionalProperties: false
      required:
      - appId
      - slug
      - name
      - installationUrl
      properties:
        appId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,99}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        installationUrl:
          type: string
          format: uri
          pattern: ^https://github\.com/apps/[a-z0-9-]+/installations/new$
    GitHubAuthorizationContext:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - NONE
      - type: object
        additionalProperties: false
        required:
        - status
        - contextId
        - expiresAt
        properties:
          status:
            type: string
            enum:
            - PENDING
            - AUTHORIZED
          contextId:
            type: string
            format: uuid
            pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          expiresAt:
            type: string
            format: date-time
    GitHubAuthorizationInstallation:
      type: object
      additionalProperties: false
      required:
      - installationId
      - accountId
      - accountLogin
      - repositorySelection
      properties:
        installationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        accountId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        accountLogin:
          type: string
          minLength: 1
          maxLength: 100
        repositorySelection:
          type: string
          enum:
          - all
          - selected
    GitHubAuthorizationUnverified:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - USER_AUTHORIZATION_REQUIRED
          - AUTHORIZATION_PENDING
          - INSTALLATION_SELECTION_REQUIRED
    GitHubAuthorizationContextStartRequest:
      type: object
      additionalProperties: false
      required:
      - workspaceId
      properties:
        workspaceId:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    GitHubAuthorizationContextStartView:
      type: object
      additionalProperties: false
      required:
      - contextId
      - expiresAt
      - authorizationUrl
      - installationUrl
      properties:
        contextId:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        expiresAt:
          type: string
          format: date-time
        authorizationUrl:
          type: string
          format: uri
          description: Backend-built GitHub user authorization URL with opaque state and S256 PKCE challenge; never
            contains access/refresh tokens.
        installationUrl:
          type: string
          format: uri
          pattern: ^https://github\.com/apps/[a-z0-9-]+/installations/new$
    GitHubAuthorizationInstallationItem:
      type: object
      additionalProperties: false
      required:
      - installationId
      - accountId
      - accountLogin
      - repositorySelection
      - suspended
      properties:
        installationId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        accountId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        accountLogin:
          type: string
          minLength: 1
          maxLength: 100
        repositorySelection:
          type: string
          enum:
          - all
          - selected
        suspended:
          type: boolean
    GitHubAuthorizationRepositoryItem:
      type: object
      additionalProperties: false
      required:
      - repositoryId
      - fullName
      - canRead
      properties:
        repositoryId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive decimal BIGINT, maximum 9223372036854775807; validate range server-side.
        fullName:
          type: string
          minLength: 3
          maxLength: 300
        canRead:
          type: boolean
          enum:
          - true
    GitHubAuthorizationProblem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
