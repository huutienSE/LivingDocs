              required: true
              schema:
                type: string
                enum:
                - no-store
            X-Correlation-ID:
              required: true
              schema:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
            Set-Cookie:
              required: true
              schema:
                type: string
              description: Scoped, host-only __Secure- cookie, HttpOnly, Secure, SameSite=Lax; one nonce per
                context; no provider or LivingDocs token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAuthorizationContextStartResponse'
        '400':
