components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal service identity; không public qua Gateway.
  responses:
    Problem:
      description: RFC 9457 + LivingDocs code/correlationId
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details + extension code/correlationId.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        correlationId:
          type: string
    CandidateObject:
      type: object
      additionalProperties: true
      description: 'CHƯA CHỐT: shape DTO dự kiến theo LD-API-001; service owner phải thay bằng properties/required
        cụ thể trước khi tuyên bố contract stable. Không dùng làm client codegen chính thức.'
    SourceBinding:
      type: object
      nullable: true
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
        headSha:
          type: string
          nullable: true
        targetKind:
          type: string
          nullable: true
          enum:
            - PR
            - TRACKED_BRANCH
        targetRef:
          type: string
          nullable: true
        comparisonSha:
          type: string
          nullable: true
        configRevision:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
    JobAccepted:
      type: object
      description: CANDIDATE — operationId/jobId sẽ do owner S02/S03 chốt. 202 không có nghĩa job hoàn thành.
      properties:
        jobId:
          type: string
        operationId:
          type: string
    AnalysisJobCreateRequest:
      type: object
      description: 'CANDIDATE S03: job chạy async; source binding phải đúng snapshot do S02 cấp.'
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
        targetKind:
          type: string
          enum:
            - PR
            - TRACKED_BRANCH
        targetRef:
          type: string
        headSha:
          type: string
        comparisonSha:
          type: string
          nullable: true
        configRevision:
          type: string
        analysisKind:
          type: string
    AnalysisJobView:
      type: object
      description: CANDIDATE S03, status enum chưa chốt với owner.
      properties:
        jobId:
          type: string
        status:
          type: string
        repositoryConnectionId:
          type: string
          format: uuid
        sourceBinding:
          $ref: '#/components/schemas/SourceBinding'
        createdAt:
          type: string
          format: date-time
    AnalysisJobList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisJobView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    DriftIssueView:
      type: object
      description: CANDIDATE classification/severity theo proposal; workflow status do owner S03 xác nhận.
      properties:
        driftIssueId:
          type: string
          format: uuid
        repositoryConnectionId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
          nullable: true
        classification:
          type: string
          enum:
            - REFERENTIAL
            - SIGNATURE
            - SEMANTIC
        severity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        status:
          type: string
        sourceSha:
          type: string
    DriftIssueList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriftIssueView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
