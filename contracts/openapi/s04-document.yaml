components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Internal service identity; không public qua Gateway.
  responses:
    Problem:
      description: RFC 9457 + LivingDocs code/correlationId
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details + extension code/correlationId.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - correlationId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        correlationId:
          type: string
    CandidateObject:
      type: object
      additionalProperties: true
      description: 'CHƯA CHỐT: shape DTO dự kiến theo LD-API-001; service owner phải thay bằng properties/required
        cụ thể trước khi tuyên bố contract stable. Không dùng làm client codegen chính thức.'
    DocumentVersionView:
      type: object
      required:
        - documentId
        - versionId
        - state
        - reviewStage
        - revision
        - sourceBinding
      properties:
        documentId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - DRAFT
            - IN_REVIEW
            - APPROVED
            - PUBLISHED
            - NEEDS_REVALIDATION
            - REJECTED
            - SUPERSEDED
        reviewStage:
          type: string
          nullable: true
          enum:
            - STAFF_REVIEW
            - MANAGER_APPROVAL
        revision:
          type: integer
          format: int64
          minimum: 0
        sourceBinding:
          $ref: '#/components/schemas/SourceBinding'
    SourceBinding:
      type: object
      nullable: true
      properties:
        repositoryConnectionId:
          type: string
          format: uuid
        headSha:
          type: string
          nullable: true
        targetKind:
          type: string
          nullable: true
          enum:
            - PR
            - TRACKED_BRANCH
        targetRef:
          type: string
          nullable: true
        comparisonSha:
          type: string
          nullable: true
        configRevision:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
    ReviewQueueItem:
      type: object
      required:
        - versionId
        - documentId
        - documentTitle
        - versionNo
        - state
        - reviewStage
      properties:
        versionId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        documentTitle:
          type: string
        versionNo:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - IN_REVIEW
        reviewStage:
          type: string
          enum:
            - STAFF_REVIEW
        sourceSha:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        submittedBy:
          type: string
          nullable: true
    ReviewQueueView:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    EvidenceView:
      type: object
      required:
        - ref
      properties:
        ref:
          type: string
          format: uuid
          description: S04 document_evidence_id, không phải source ref/string tự do
        label:
          type: string
        kind:
          type: string
    ReviewContextView:
      type: object
      required:
        - version
        - documentTitle
        - versionNo
        - content
        - evidence
      properties:
        version:
          $ref: '#/components/schemas/DocumentVersionView'
        documentTitle:
          type: string
        versionNo:
          type: integer
          minimum: 1
        content:
          type: string
        contentFormat:
          type: string
          enum:
            - MARKDOWN
            - TEXT
        submittedBy:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewRound:
          type: integer
          minimum: 0
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceView'
    ManagerDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - FINAL_APPROVE
            - RETURN_STAFF
            - RETURN_DEV
            - REJECT
        reason:
          type: string
        evidenceRefs:
          type: array
          items:
            type: string
            format: uuid
      description: CANDIDATE — no-self-approval và fresh authorization là server guard, không dựa vào body.
    JobAccepted:
      type: object
      description: CANDIDATE — operationId/jobId sẽ do owner S02/S03 chốt. 202 không có nghĩa job hoàn thành.
      properties:
        jobId:
          type: string
        operationId:
          type: string
    DocumentCreateRequest:
      type: object
      description: 'CANDIDATE S04: membership và collection ownership server-side.'
      properties:
        title:
          type: string
        collectionId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
    DocumentView:
      type: object
      description: CANDIDATE S04; document version là tài nguyên riêng.
      properties:
        documentId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        currentVersionId:
          type: string
          format: uuid
          nullable: true
    DocumentSummaryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentView'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
    DocumentEvidenceView:
      type: object
      description: CANDIDATE S04 evidence refs must be UUID backed by tenant/version; source binding is immutable
        evidence.
      properties:
        versionId:
          type: string
          format: uuid
        sourceBinding:
          $ref: '#/components/schemas/SourceBinding'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceView'
    SubmitReviewRequest:
      type: object
      description: 'CANDIDATE S04: action transition is server-determined, client cannot choose target state.'
      additionalProperties: false
      properties:
        note:
          type: string
    ReviewHistoryView:
      type: object
      description: 'CANDIDATE S04: decisions + audit visibility limited by scope.'
      properties:
        versionId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandidateObject'
