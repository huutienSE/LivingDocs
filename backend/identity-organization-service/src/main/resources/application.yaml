spring:
  application:
    name: identity-organization-service
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s

livingdocs:
  s02:
    binding:
      base-url: ${S02_BINDING_BASE_URL:}
      path: ${S02_BINDING_PATH:/internal/v1/repository-bindings/verify} # đường dẫn http s02 dùng để xác minh req một grant
      audience: ${S02_BINDING_AUDIENCE:livingdocs-s02-internal} # service đihcs được phép nhận service jwt
      operation: ${S02_BINDING_OPERATION:repository-binding:verify} # thao tác
      timeout-ms: ${S02_BINDING_TIMEOUT_MS:1500}
      allow-http: ${S02_BINDING_ALLOW_HTTP:false} # băt phải dùng https/tls
  security:
    jwt:
      # định  danh hệ thống nơi phát hành jwt
      issuer: ${JWT_ISSUER:urn:livingdocs:s01}
      # API mà jwt hướng đến
      audience: ${JWT_AUDIENCE:livingdocs-api}
      # Đường dẫn file private key để ký JWT, private key dùng để ký jwt
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      # Đường dẫn file public key tương ứng, public key dùng để xác minh chữ ký
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      # Đường dẫn public key cũ khi rotation
      previous-public-key-path: ${JWT_PREVIOUS_PUBLIC_KEY_PATH:}
    workloads:
      registry-path: ${S01_WORKLOAD_REGISTRY_PATH:}
      # bật cơ chế cho phép đượng truyền ko an toàn, khong ma hoa tls/https
      allow-insecure-transport: ${S01_INTERNAL_ALLOW_INSECURE_TRANSPORT:false} # cờ bật tắt phép gọi endpoint cấp service token qua kết nối không có TLS/HTTPS (http.isSecure() == false, biến môi trường setup là true ==> có
    login:
      rate-limit:
        # đường dẫn đến file pepper trong redis limiter sử dụng HMAC để tạo key từ email đã chuẩn hóa - HMAC-SHA256(email, pepper) -
        pepper-path: ${LOGIN_RATE_LIMIT_PEPPER_PATH:}

server:
  port: ${SERVER_PORT:0}

management:
  endpoints:
    exposure:
      include: health, info
