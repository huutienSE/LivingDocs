spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:intelligence}
    default-schema: ${DB_SCHEMA:intelligence}
    create-schemas: false
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
