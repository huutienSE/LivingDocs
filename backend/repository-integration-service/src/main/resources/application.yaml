spring:
  application:
    name: repository-integration-service
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:0}

management:
  endpoints:
    exposure:
      include: health, info
