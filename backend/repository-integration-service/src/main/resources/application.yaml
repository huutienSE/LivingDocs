spring:
  application:
    name: repository-integration-service
  config:
    import:
      - "optional:file:./backend/repository-integration-service/.env[.properties]"
      - "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:0}

livingdocs:
  github:
    authorization:
      jwk-set-uri: ${LIVINGDOCS_GITHUB_AUTHORIZATION_JWK_SET_URI:}
      s01-base-uri: ${LIVINGDOCS_GITHUB_AUTHORIZATION_S01_BASE_URI:}
      app-id: ${LIVINGDOCS_GITHUB_AUTHORIZATION_APP_ID:}
      app-slug: ${LIVINGDOCS_GITHUB_AUTHORIZATION_APP_SLUG:}
      app-name: ${LIVINGDOCS_GITHUB_AUTHORIZATION_APP_NAME:}
      client-id: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CLIENT_ID:${LIVINGDOCS_SOURCE_GITHUB_CLIENTID:}}
      client-secret-path: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CLIENT_SECRET_PATH:}
      browser-origin: ${LIVINGDOCS_GITHUB_AUTHORIZATION_BROWSER_ORIGIN:}
      callback-uri: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CALLBACK_URI:}
      completion-uri: ${LIVINGDOCS_GITHUB_AUTHORIZATION_COMPLETION_URI:}
      state-key-directory: ${LIVINGDOCS_GITHUB_AUTHORIZATION_STATE_KEY_DIRECTORY:}
      credential-key-directory: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CREDENTIAL_KEY_DIRECTORY:}
      state-key-version: ${LIVINGDOCS_GITHUB_AUTHORIZATION_STATE_KEY_VERSION:v1}
      credential-key-version: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CREDENTIAL_KEY_VERSION:v1}
      context-ttl: "${LIVINGDOCS_GITHUB_AUTHORIZATION_CONTEXT_TTL_SECONDS:900}s"
      cleanup-enabled: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CLEANUP_ENABLED:true}
      cleanup-delay-ms: ${LIVINGDOCS_GITHUB_AUTHORIZATION_CLEANUP_DELAY_MS:30000}
      allow-local-http: ${LIVINGDOCS_GITHUB_AUTHORIZATION_ALLOW_LOCAL_HTTP:false}
  source:
    request-timeout: "${LIVINGDOCS_SOURCE_REQUEST_TIMEOUT_SECONDS:15}s"
    github:
      client-id: ${LIVINGDOCS_SOURCE_GITHUB_CLIENTID:}
      key-directory: ${LIVINGDOCS_SOURCE_GITHUB_KEYDIRECTORY:}
    lookup:
      github-ready-statuses: ${LIVINGDOCS_SOURCE_LOOKUP_GITHUBREADYSTATUSES:}

management:
  endpoints:
    exposure:
      include: health, info
