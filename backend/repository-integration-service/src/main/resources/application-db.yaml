spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: "${LIVINGDOCS_SOURCE_REQUEST_TIMEOUT_SECONDS:15}000"
      data-source-properties:
        connectTimeout: ${LIVINGDOCS_SOURCE_REQUEST_TIMEOUT_SECONDS:15}
        socketTimeout: ${LIVINGDOCS_SOURCE_REQUEST_TIMEOUT_SECONDS:15}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}
    create-schemas: false
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
