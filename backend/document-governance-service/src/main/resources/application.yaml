spring:
  application:
    name: document-governance-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

server:
  port: ${SERVER_PORT:0}

management:
  endpoints:
    exposure:
      include: health, info

springdoc:
  api-docs:
    enabled: ${S04_OPENAPI_ENABLED:false}
    version: OPENAPI_3_0
  packages-to-scan: com.livingdocs.document.controller
  paths-to-match: /api/v1/document-versions/*/staff-decisions,/api/v1/document-versions/*/submit,/api/v1/approval-queue,/api/v1/document-versions/*/approval-context
  override-with-generic-response: false

livingdocs:
  review:
    access-context-uri: ${S01_REVIEW_ACCESS_CONTEXT_URI:}
    service-token-uri: ${S01_REVIEW_SERVICE_TOKEN_URI:}
    authorization-uri: ${S01_REVIEW_AUTHORIZATION_URI:}
    workload-secret-path: ${S04_REVIEW_WORKLOAD_SECRET_PATH:}
    allow-insecure-http: ${S04_REVIEW_ALLOW_INSECURE_HTTP:false}
  approval:
    # API-122/123 read Manager scope from the same S01 API-038 endpoint as Staff Review unless overridden.
    access-context-uri: ${S01_APPROVAL_ACCESS_CONTEXT_URI:${livingdocs.review.access-context-uri:}}
    allow-insecure-http: ${S04_APPROVAL_ALLOW_INSECURE_HTTP:${livingdocs.review.allow-insecure-http:false}}
    queue:
      max-page-size: ${S04_APPROVAL_QUEUE_MAX_PAGE_SIZE:100}
  submit:
    access-context-uri: ${S01_SUBMIT_ACCESS_CONTEXT_URI:}
    allow-insecure-http: ${S04_SUBMIT_ALLOW_INSECURE_HTTP:false}
  security:
    issuer-uri: ${S01_ISSUER_URI:}
    jwk-set-uri: ${S01_JWK_SET_URI:}
    audience: ${S04_TOKEN_AUDIENCE:}
