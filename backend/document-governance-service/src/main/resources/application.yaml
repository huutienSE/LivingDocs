spring:
  application:
    name: document-governance-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

server:
  port: ${SERVER_PORT:0}

management:
  endpoints:
    exposure:
      include: health, info

springdoc:
  api-docs:
    enabled: ${S04_OPENAPI_ENABLED:false}
    version: OPENAPI_3_0
  packages-to-scan: com.livingdocs.document.controller
  paths-to-match: /api/v1/document-versions/*/staff-decisions,/api/v1/document-versions/*/submit
  override-with-generic-response: false

livingdocs:
  authorization:
    service-token-uri: ${S01_AUTHORIZATION_SERVICE_TOKEN_URI:${livingdocs.review.service-token-uri:}}
    authorization-uri: ${S01_AUTHORIZATION_EVALUATION_URI:${livingdocs.review.authorization-uri:}}
    workload-secret-path: ${S04_AUTHORIZATION_WORKLOAD_SECRET_PATH:${livingdocs.review.workload-secret-path:}}
    allow-insecure-http: ${S04_AUTHORIZATION_ALLOW_INSECURE_HTTP:${livingdocs.review.allow-insecure-http:false}}
  review:
    access-context-uri: ${S01_REVIEW_ACCESS_CONTEXT_URI:}
    service-token-uri: ${S01_REVIEW_SERVICE_TOKEN_URI:}
    authorization-uri: ${S01_REVIEW_AUTHORIZATION_URI:}
    workload-secret-path: ${S04_REVIEW_WORKLOAD_SECRET_PATH:}
    allow-insecure-http: ${S04_REVIEW_ALLOW_INSECURE_HTTP:false}
  submit:
    access-context-uri: ${S01_SUBMIT_ACCESS_CONTEXT_URI:}
    allow-insecure-http: ${S04_SUBMIT_ALLOW_INSECURE_HTTP:false}
  security:
    issuer-uri: ${S01_ISSUER_URI:}
    jwk-set-uri: ${S01_JWK_SET_URI:}
    audience: ${S04_TOKEN_AUDIENCE:}
