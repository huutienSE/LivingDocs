name: OpenAPI Contract CI

on:
  pull_request:
    branches: [develop, main]
    paths: # phạm vi kích hoạt, các file nằm trong các path bên dưới
      - "contracts/openapi/**"
      - ".github/workflows/openapi-contract-ci.yaml"
      - "scripts/validate_gateway_openapi.py"
      - "infrastructure/api-gateway/src/main/resources/application.yaml"
      - "infrastructure/api-gateway/src/main/java/com/livingdocs/gateway/config/GatewayCorsConfig.java"
      - "infrastructure/docker/compose.yaml"

  push:
    branches: [develop, main]
    paths:
      - "contracts/openapi/**"
      - ".github/workflows/openapi-contract-ci.yaml"
      - "scripts/validate_gateway_openapi.py"
      - "infrastructure/api-gateway/src/main/resources/application.yaml"
      - "infrastructure/api-gateway/src/main/java/com/livingdocs/gateway/config/GatewayCorsConfig.java"
      - "infrastructure/docker/compose.yaml"

permissions:
  contents: read

jobs:
  validate-openapi:
    name: Validate OpenAPI Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # tải mã nguồn về máy ảo của runner để kiểm tra
      - name: Checkout
        uses: actions/checkout@v7
      #cài đặt môi trường
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      #cài thư viện liên quan
      - name: Install validator
        run: |
          python -m pip install \
            openapi-spec-validator==0.7.2 \
            PyYAML==6.0.3

      # kiểm tra cú pháp
      - name: Validate OpenAPI YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          from openapi_spec_validator import validate

          files = sorted(Path("contracts/openapi").glob("*.yaml"))
          files += sorted(Path("contracts/openapi").glob("*.yml"))

          if not files:
              raise SystemExit("No OpenAPI YAML files found")

          for path in files:
              import yaml
              with path.open(encoding="utf-8") as f:
                  spec = yaml.safe_load(f)
              validate(spec)
              print(f"PASS: {path}")
          PY

      #kiểm tra tính đồng bộ giữa gateway và openapi
      - name: Validate Gateway and OpenAPI alignment
        run: python scripts/validate_gateway_openapi.py

