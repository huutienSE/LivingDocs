name: Backend CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S01 Identity
            path: backend/identity-organization-service
          - name: S02 Repository
            path: backend/repository-integration-service
          - name: S03 Intelligence
            path: backend/source-intelligence-service
          - name: S04 Document
            path: backend/document-governance-service
          - name: API Gateway
            path: infrastructure/api-gateway

    steps:
      # Checkout ma nguon
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cai JDK java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.path }}/pom.xml

      - name: Build and test
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B -ntp clean verify
